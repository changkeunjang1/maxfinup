{% extends "ledger/base.html" %}
{% block content %}
<div class="sh-auth">
  <aside class="sh-auth-brand" aria-hidden="true">
    <p class="hero-eyebrow">MAXFINUP MEMBERS</p>
    <p class="sh-auth-title">회원 전용<br><em>자산 · 노후 노트</em></p>
    <ul>
      <li>자산관리 — 연금 · 보험 · 상속 상세</li>
      <li>인생 후반전 — 연금 · 투자 · 건강 · 관계</li>
      <li>인생 후반전1 — 2026 실전 노트와 체크리스트</li>
    </ul>
    <p class="sh-auth-note">회원 전용 콘텐츠입니다. 가입 후 관리자 승인이 끝나면 모든 본문을 읽을 수 있습니다.</p>
  </aside>
  <section class="sh-auth-card">
    {% block auth %}{% endblock %}
  </section>
</div>
<script>
/* 비밀번호 칸 오른쪽 눈 버튼: 누르면 입력한 비밀번호를 보이거나 다시 가린다 */
document.querySelectorAll("[data-pw-toggle]").forEach(function (btn) {
  btn.addEventListener("click", function () {
    var input = document.getElementById(btn.getAttribute("aria-controls"));
    if (!input) return;
    var show = input.type === "password";
    input.type = show ? "text" : "password";
    btn.setAttribute("aria-pressed", show ? "true" : "false");
    btn.setAttribute("aria-label", show ? "비밀번호 숨기기" : "비밀번호 보기");
    btn.title = btn.getAttribute("aria-label");
    input.focus();
  });
});
</script>
{% endblock %}
